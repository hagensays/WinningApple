name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  safety:
    name: Safety invariants
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce read-only and local-output rules
        shell: pwsh
        run: ./tests/StaticSafetyChecks.ps1

  build:
    name: Build .NET Framework 4.7.2
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: msbuild HSScanner.sln /m /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU"

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = 'src\HSScanner\bin\Release\HSScanner.exe'
          if (-not (Test-Path $exe)) { throw "Expected executable missing: $exe" }
          $size = (Get-Item $exe).Length
          if ($size -lt 10240) { throw "Executable is unexpectedly small: $size bytes" }
          Write-Host "Built $exe ($size bytes)"

      - name: Upload CI build
        uses: actions/upload-artifact@v4
        with:
          name: HSScanner-pr-build
          path: src/HSScanner/bin/Release/HSScanner.exe
          if-no-files-found: error
